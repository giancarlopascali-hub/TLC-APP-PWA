name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Replace 'your-username/TLC-APP-PWA' with your actual Hugging Face Space path
          git push --force https://realgcp:$HF_TOKEN@huggingface.co/spaces/realgcp/TLC-APP-PWA main
