name: Mobile Streamlit checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  streamlit-candidate:
    name: Streamlit candidate checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Audit Streamlit dependencies
        run: python -m pip install pip-audit && python -m pip_audit -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile streamlit_app.py tlc_backend.py

      - name: Run Streamlit Python tests
        run: python -m pytest tests/python/test_tlc_backend.py tests/python/test_streamlit_protocol.py -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend module syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print0)

      - name: Run browser-logic tests
        run: node --test tests/javascript/*.test.mjs

      - name: Scan tracked source for high-risk secret patterns
        shell: bash
        run: |
          if git grep -nI -E -e '-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}' -- ':!tests/fixtures'; then
            echo "Potential secret material found. Remove it and use deployment secrets instead."
            exit 1
          fi

      - name: Start Streamlit smoke test
        shell: bash
        run: |
          streamlit run streamlit_app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          streamlit_pid=$!
          trap 'kill "$streamlit_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat streamlit.log
          exit 1

  legacy-fallback:
    name: Retained Flask fallback checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-legacy.txt
            requirements-dev.txt

      - name: Install legacy dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-legacy.txt -r requirements-dev.txt

      - name: Check legacy dependency consistency
        run: python -m pip check

      - name: Audit legacy dependencies
        run: python -m pip install pip-audit && python -m pip_audit -r requirements-legacy.txt

      - name: Compile and smoke-test legacy server
        run: |
          python -m py_compile server.py
          python -m pytest tests/python/test_legacy_server.py -q

      - name: Build retained legacy Docker image
        run: docker build --tag aq-tlc-legacy-smoke .
