<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TLC Analyzer Pro v6</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body class="dark-mode">
    <div class="app-shell">
        <!-- Top Actions Header -->
        <header class="main-header">
            <div class="header-actions">
                <button id="btn-new" class="icon-btn" title="New Image">🆕</button>
                <button id="btn-reset-img" class="icon-btn" title="Reset Image">🔄</button>
                <button id="btn-undo" class="icon-btn" title="Undo">↶</button>
            </div>
            <h1 class="app-title">TLC ANALYZER</h1>
            <div class="header-spacer"></div>
        </header>

        <!-- Top Navigation Tabs -->
        <nav class="top-tabs">
            <button class="tab-btn active" data-tab="tab-image">IMAGE</button>
            <button class="tab-btn" data-tab="tab-profile">PROFILE</button>
            <button class="tab-btn" data-tab="tab-table">TABLE</button>
        </nav>

        <!-- Main View Area -->
        <main id="view-container">
            <!-- Landing View -->
            <section id="view-landing" class="view active">
                <div class="landing-card">
                    <div class="hero-icon">🔬</div>
                    <h2>Quantitative TLC</h2>
                    <p>Load a chromatography plate to begin analysis.</p>
                    <div class="upload-btns">
                        <button id="landing-upload" class="btn-primary">📁 Upload Plate</button>
                        <button id="landing-camera" class="btn-primary">📷 Capture Photo</button>
                    </div>
                    <input type="file" id="file-input" accept="image/*" style="display:none">
                    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
                </div>
            </section>

            <!-- Image View -->
            <section id="tab-image" class="view">
                <div class="canvas-wrapper" id="canvas-container">
                    <canvas id="canvas-main"></canvas>
                </div>
                <div class="bottom-toolbar" id="toolbar-image">
                    <div class="tool-group">
                        <button class="tool-item active" data-tool="pan">🖐️<span>Pan</span></button>
                        <button class="tool-item" data-tool="roi">📦<span>Crop</span></button>
                        <button class="tool-item" data-tool="rotate">🔄<span>Rotate</span></button>
                        <button class="tool-item" data-tool="line">📏<span>Line</span></button>
                        <button class="tool-item" data-tool="spot">📍<span>Mark</span></button>
                        <button class="tool-item" data-tool="select">🖱️<span>Select</span></button>
                    </div>
                    <button id="btn-find-lanes" class="btn-action">📡 FIND LANES</button>
                </div>
            </section>

            <!-- Profile View -->
            <section id="tab-profile" class="view">
                <div id="profile-display" class="scroll-area">
                    <!-- Densitograms injected here -->
                    <div class="empty-msg">Detect lanes first to see profiles.</div>
                </div>
                <div class="bottom-toolbar" id="toolbar-profile">
                    <div class="settings-strip">
                        <div class="slider-box">
                            <label>SENS <span id="val-sens">40</span></label>
                            <input type="range" id="peak-sens" min="1" max="80" value="40">
                        </div>
                        <div class="slider-box">
                            <label>RES <span id="val-res">10</span></label>
                            <input type="range" id="peak-res" min="1" max="50" value="10">
                        </div>
                    </div>
                    <div class="tool-group">
                        <button id="btn-peak-mode" class="tool-item" data-mode="add">➕<span>Add Peak</span></button>
                        <button id="btn-reset-peaks" class="tool-item">🗑️<span>Clear</span></button>
                    </div>
                </div>
            </section>

            <!-- Table View -->
            <section id="tab-table" class="view">
                <div id="table-display" class="scroll-area">
                    <table class="q-table">
                        <thead>
                            <tr id="table-header">
                                <th>Lane.Pk</th>
                                <th>Rf</th>
                                <th>Area</th>
                                <th>% Area</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
                <div class="bottom-toolbar" id="toolbar-table">
                    <div class="mode-selector">
                        <button class="mode-btn active" data-mode="relative">REL AREA</button>
                        <button class="mode-btn" data-mode="area-cal">AREA CAL</button>
                        <button class="mode-btn" data-mode="mw-cal">MW CAL</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="debug-overlay"></div>
    <script src="app.js"></script>
</body>
</html>
