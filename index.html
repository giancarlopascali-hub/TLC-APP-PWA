<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TLC Analyzer Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <script>
        // Unregister old service workers to fix cache loops on PC
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
                regs.forEach(r => r.unregister());
                if (regs.length > 0) window.location.reload();
            });
        }
    </script>

    <div class="bg-mesh"></div>
    
    <div class="app-shell">
        <header>
            <h1 id="header-title">TLC ANALYZER <span style="color:var(--accent-color); font-weight:400;">PRO</span></h1>
            <div style="display:flex; gap:10px;">
                <button id="btn-undo" class="tool-btn" style="width:40px; height:40px;">↶</button>
                <button id="btn-settings" class="tool-btn" style="width:40px; height:40px;">⚙️</button>
            </div>
        </header>

        <main id="app-main">
            <!-- Landing View -->
            <section id="view-landing" class="view active">
                <div class="hero-card">
                    <span class="hero-icon">🔬</span>
                    <h2 class="hero-title">Quantitative TLC</h2>
                    <p class="hero-desc">Professional chromatography analysis. Support for multiple Origin/Front pairs and automated peak quantification.</p>
                    
                    <div class="btn-group">
                        <button id="btn-camera" class="btn btn-primary">
                            <span>📷</span> Capture Plate
                        </button>
                        <button id="btn-upload-trigger" class="btn btn-secondary">
                            <span>📁</span> Upload Image
                        </button>
                        <input type="file" id="file-input" accept="image/*" style="display:none">
                        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
                    </div>
                </div>
            </section>

            <!-- Workspace View (Image Tab) -->
            <section id="tab-image" class="view">
                <div class="canvas-container" id="canvas-container">
                    <canvas id="canvas-main"></canvas>
                </div>

                <div class="toolbar">
                    <button class="tool-btn active" data-tool="pan">🖐️<span>Pan</span></button>
                    <button class="tool-btn" data-tool="roi">📦<span>Crop</span></button>
                    <button class="tool-btn" data-tool="line">📏<span>Lines</span></button>
                    <button class="tool-btn" data-tool="spotting">📍<span>Marks</span></button>
                    <button id="btn-analyze" class="tool-btn" style="color:#238636;">📡<span>Run</span></button>
                </div>
            </section>

            <!-- Profiles Tab -->
            <section id="tab-profile" class="view">
                <div style="flex:1; overflow-y:auto; padding:15px;" id="res-profiles">
                    <!-- Dynamic Profiles -->
                    <div class="empty-state">
                        <span style="font-size:3rem;">📈</span>
                        <h3>No Profiles</h3>
                        <p>Draw lines and marks, then Run analysis.</p>
                    </div>
                </div>
            </section>

            <!-- Table Tab -->
            <section id="tab-table" class="view">
                <div style="flex:1; overflow-y:auto; padding:15px;" id="res-table">
                    <!-- Dynamic Table -->
                    <div class="empty-state">
                        <span style="font-size:3rem;">📋</span>
                        <h3>No Data</h3>
                        <p>Analyze a plate to see peak data.</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Fixed Bottom Nav -->
        <nav class="bottom-nav">
            <button class="nav-tab active" data-target="tab-image">
                <span>🖼️</span> Image
            </button>
            <button class="nav-tab" data-target="tab-profile">
                <span>📈</span> Profile
            </button>
            <button class="nav-tab" data-target="tab-table">
                <span>📋</span> Table
            </button>
        </nav>
    </div>

    <!-- Drawer / Panels -->
    <div id="overlay" class="overlay"></div>
    <div id="drawer" class="drawer">
        <div class="drawer-handle"></div>
        <div id="drawer-content"></div>
    </div>

    <div id="debug-overlay"></div>

    <script src="app.js"></script>
</body>
</html>
