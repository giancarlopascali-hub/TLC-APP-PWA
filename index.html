<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>AQ-TLC Mobile</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=9">
</head>
<body class="dark-mode">
  <div class="app-container">

    <!-- Top App Bar -->
    <header class="top-bar">
      <button class="icon-btn" id="btn-menu" aria-label="Open Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <div class="app-title">AQ-TLC <span class="version-tag">PWA</span></div>
      <label for="file-input" class="icon-btn" id="btn-upload" aria-label="Upload Image" style="cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      </label>
      <label for="camera-input" class="icon-btn" aria-label="Take Photo" style="cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </label>
      <input type="file" id="file-input" accept="image/*" style="display:none">
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
    </header>

    <!-- Side Navigation Drawer (Hamburger Menu) -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <aside class="drawer" id="drawer">
      <div class="drawer-header">
        <h2>Tools & Settings</h2>
        <button class="icon-btn" id="btn-close-menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="drawer-content" id="drawer-content">
        <!-- This content will be populated dynamically by app.js based on the active tab -->
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="viewport">
      
      <!-- Tab 1: Image View -->
      <section id="tab-image" class="tab-content active">
        <label for="file-input" class="empty-state" id="upload-prompt" style="cursor: pointer; display: flex; flex-direction: column; align-items: center;">
          <div class="upload-icon">📸</div>
          <h3>Load a Plate</h3>
          <p>Tap here to take a photo or select an image.</p>
        </label>
        <div class="canvas-container" id="canvas-container" style="display: none;">
          <canvas id="canvas-main"></canvas>
        </div>
      </section>

      <!-- Tab 2: Profile (Densitogram) -->
      <section id="tab-profile" class="tab-content">
        <div class="empty-state">
          <div class="upload-icon">📈</div>
          <h3>No Profiles Yet</h3>
          <p>Detect lanes on the image tab first.</p>
        </div>
        <div id="densitogram-list" style="display: none;">
          <!-- Profiles will be injected here -->
        </div>
      </section>

      <!-- Tab 3: Table -->
      <section id="tab-table" class="tab-content">
        <div class="empty-state">
          <div class="upload-icon">📊</div>
          <h3>No Data Yet</h3>
          <p>Detect lanes and peaks to view the data table.</p>
        </div>
        <div class="data-table-container" style="display: none;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Lane</th>
                <th>Rf</th>
                <th>Height</th>
                <th>Area</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <!-- Data rows will be injected here -->
            </tbody>
          </table>
        </div>
      </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-tab active" data-target="tab-image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        <span>Image</span>
      </button>
      <button class="nav-tab" data-target="tab-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        <span>Profile</span>
      </button>
      <button class="nav-tab" data-target="tab-table">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        <span>Table</span>
      </button>
    </nav>

  </div>
  <script src="app.js?v=9"></script>
</body>
</html>
